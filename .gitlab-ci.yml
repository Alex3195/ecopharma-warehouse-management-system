image: gradle:8.6.0-jdk21-alpine

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  SPRING_PROFILES_ACTIVE_TEST: test # Use prod for main branch
  SPRING_PROFILES_ACTIVE_DEV: dev # Use prod for main branch
  SPRING_PROFILES_ACTIVE_STAGE: stage # Use prod for main branch
  SPRING_PROFILES_ACTIVE_PROD: prod # Use prod for main branch
  SPRING_DB_USERNAME: postgres
  SPRING_DB_PASSWORD: postgres
  DOCKER_IMAGE: $CI_REGISTRY/$DOCKER_USERNAME/eco-pharma-warehouse
  DOCKER_TAG_TEST: latest-test
  DOCKER_TAG_DEV: latest-dev
  DOCKER_TAG_STAGE: latest-stage
  DOCKER_TAG_PROD: latest
  SERVER_SSH_PORT_DEV: 22
  SERVER_SSH_PORT_TEST: 2222
  SERVER_SSH_PORT_STAGE: 2222
  SERVER_SSH_PORT_PROD: 2221
  BUILDER: "tempbuilder-$CI_PIPELINE_ID"

stages:
  - build
  - test
  - publish
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG-gradle-cache"
  paths:
    - ~/.gradle/caches/
    - ~/.gradle/wrapper/
  policy: pull-push
  when: always

# Stage 1: Build the JAR file
.build_template: &build_template
  stage: build
  script:
    - gradle clean bootJar

build-test:
  <<: *build_template
  only:
    - test

build-dev:
  <<: *build_template
  only:
    - dev

build-stage:
  <<: *build_template
  only:
    - stage

build-prod:
  <<: *build_template
  only:
    - main

gradle-test:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres-db
      variables:
        POSTGRES_DB: $DB
        POSTGRES_USER: $SPRING_DB_USERNAME
        POSTGRES_PASSWORD: $SPRING_DB_PASSWORD
    - name: redis:latest
      alias: redis
  before_script:
    - apk update && apk add --no-cache netcat-openbsd redis
    - redis-cli -h redis ping || (echo "Redis не запущен!" && exit 1)
    - echo "Checking environment variables..."
    - echo "SPRING_REDIS_HOST=$SPRING_REDIS_HOST"
    - echo "SPRING_REDIS_PORT=$SPRING_REDIS_PORT"
    - echo "Testing Redis connection..."
    - until nc -z redis 6379; do echo "Waiting for Redis..."; sleep 5; done
    - echo "Redis is up!"
  script:
    - gradle test
  only:
    - main
# Stage 2: Publish Docker image
.publish_template: &publish_template
  stage: publish
  image: docker:24.0
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker version
    - docker info
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $CI_REGISTRY
  script:
    - docker buildx create --use --name "$BUILDER_NAME"
    - docker buildx inspect --bootstrap
    - docker buildx build --builder "$BUILDER_NAME" --build-arg SPRING_PROFILE=$SPRING_PROFILE --build-arg SERVER_PORT=$SERVER_PORT --build-arg DEBUG_PORT=$DEBUG_PORT --build-arg JAVA_OPTS="-Xms1g -Xmx2g" --build-arg EXTRA_ARGS="" -t $DOCKER_IMAGE_NAME:$DOCKER_TAG -t $DOCKER_IMAGE_NAME:$CI_COMMIT_SHA --push .
  after_script:
    - docker buildx stop "$BUILDER_NAME" || true
    - docker buildx rm "$BUILDER_NAME" || true
    - docker container prune -f || true
    - docker image prune -af || true
    - docker volume prune -f || true



publish-test:
    <<: *publish_template
    variables:
        SPRING_PROFILE: $SPRING_PROFILES_ACTIVE_TEST
        DOCKER_TAG: $DOCKER_TAG_TEST
        SERVER_PORT: 1091
        DEBUG_PORT: 1092
    only:
        - test

publish-dev:
  <<: *publish_template
  variables:
    SPRING_PROFILE: $SPRING_PROFILES_ACTIVE_DEV
    DOCKER_TAG: $DOCKER_TAG_DEV
    SERVER_PORT: 9091
    DEBUG_PORT: 9092
  only:
    - dev

publish-stage:
    <<: *publish_template
    variables:
        SPRING_PROFILE: $SPRING_PROFILES_ACTIVE_STAGE
        DOCKER_TAG: $DOCKER_TAG_STAGE
        SERVER_PORT: 9091
        DEBUG_PORT: 9092
    only:
        - stage

publish-prod:
  <<: *publish_template
  variables:
    SPRING_PROFILE: $SPRING_PROFILES_ACTIVE_PROD
    DOCKER_TAG: $DOCKER_TAG_PROD
    SERVER_PORT: 9091
    DEBUG_PORT: 9092
  only:
    - main

.deploy_template: &deploy_template
  stage: deploy
  image: alpine:latest
  before_script:
    - set -euxo pipefail
    - apk add --no-cache openssh-client netcat-openbsd
    - test -n "$SERVER_IP"
    - test -n "$SERVER_USER"
    - test -n "$SERVER_SSH_PORT"
    - test -n "$PRIVATE_KEY"
    - test -n "$COMPOSE_FILE"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - timeout 10 nc -z -v "$SERVER_IP" "$SERVER_SSH_PORT"
    - ssh-keyscan -p "$SERVER_SSH_PORT" "$SERVER_IP" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_IP" 'echo SSH connection OK'
  script:
    - export SSH_CMD="ssh -o StrictHostKeyChecking=yes -p $SERVER_SSH_PORT $SERVER_USER@$SERVER_IP"
    - $SSH_CMD "mkdir -p gitlab-runner-api/wms-service && chmod 755 gitlab-runner-api/wms-service"
    - scp -P $SERVER_SSH_PORT -o StrictHostKeyChecking=yes $COMPOSE_FILE $SERVER_USER@$SERVER_IP:gitlab-runner-api/wms-service/
    - $SSH_CMD "cd gitlab-runner-api/wms-service && docker compose -f $COMPOSE_FILE down || true"
    - $SSH_CMD "cd gitlab-runner-api/wms-service && docker compose -f $COMPOSE_FILE pull"
    - $SSH_CMD "cd gitlab-runner-api/wms-service && docker compose -f $COMPOSE_FILE up -d"
    - $SSH_CMD "docker system prune -af --filter 'until=24h' || true"


deploy-test:
  <<: *deploy_template
  variables:
    SERVER_IP: $SERVER_IP_TEST
    PRIVATE_KEY: $SSH_PRIVATE_KEY_TEST
    SERVER_PORT: $SERVER_SSH_PORT_TEST
    SERVER_USER: $SERVER_USER_TEST
    COMPOSE_FILE: docker-compose-wms-test.yml
  only:
    - test

deploy-dev:
  <<: *deploy_template
  variables:
    SERVER_IP: $SERVER_IP_DEV
    PRIVATE_KEY: $SSH_PRIVATE_KEY
    SERVER_PORT: $SERVER_SSH_PORT_DEV
    SERVER_USER: $SERVER_USER_DEV
    COMPOSE_FILE: docker-compose-wms-dev.yml
  only:
    - dev

deploy-stage:
  <<: *deploy_template
  variables:
    SERVER_IP: $SERVER_IP_STAGE
    PRIVATE_KEY: $SSH_PRIVATE_KEY_STAGE
    SERVER_PORT: $SERVER_SSH_PORT_STAGE
    SERVER_USER: $SERVER_USER_STAGE
    COMPOSE_FILE: docker-compose-wms-stage.yml
  only:
    - stage

deploy-prod:
  <<: *deploy_template
  variables:
    SERVER_IP: $SERVER_IP_PROD
    PRIVATE_KEY: $SSH_PRIVATE_KEY_PROD
    SERVER_PORT: $SERVER_SSH_PORT_PROD
    SERVER_USER: $SERVER_USER_PROD
    COMPOSE_FILE: docker-compose-wms-prod.yml
  only:
    - main