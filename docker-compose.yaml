version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: ecopharm-warehouse-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    networks:
      - ecopharm-data

volumes:
  pg-data:
    driver: local

networks:
  ecopharm-data:
    driver: bridge