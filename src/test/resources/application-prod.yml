server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PASSWORD}
  jpa:
    show-sql: false
  liquibase:
    default-schema: ${LIQUIBASE_DEFAULT_SCHEMA}

keycloak:
  realm: ${KEYCLOAK_REALM}
  auth-server-url: ${KEYCLOAK_URL}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

api:
  url: ${API_URL}
  connection-timeout: ${CONNECTION_TIME_OUT}
  read-timeout: ${READ_TIME_OUT}

