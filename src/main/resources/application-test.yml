server:
  port: 9091

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: postgres
  jpa:
    show-sql: true
  liquibase:
    default-schema: public

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    filter: true
    path: /swagger-ui
    try-it-out-enabled: true
    operations-sorter: method

