server:
  port: 1091

spring:
  datasource:
    url: jdbc:postgresql://192.168.100.193:5434/wms
    username: postgres
    password: postgres
  jpa:
    show-sql: true
  liquibase:
    default-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.rivermed.uz/realms/eco-pharma
          jwk-set-uri: https://keycloak.rivermed.uz/realms/eco-pharma/protocol/openid-connect/certs
  rabbitmq:
    host: 192.168.100.194
    port: 5671
    username: admin
    password: admin!123
    ssl:
      enabled: true
      algorithm: TLSv1.2
      validate-server-certificate: false

keycloak:
  realm: eco-pharma
  auth-server-url: https://keycloak.rivermed.uz
  client-id: eco-pharma
  client-secret: QG25UNd5aOrrmttgOAkRQwWZZUag62ko
  public-key: 


eureka:
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://192.168.100.193:8098/eureka/
    healthcheck:
      enabled: true
    fetch-registry: true
    register-with-eureka: true
