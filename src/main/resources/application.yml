spring:
  application:
    name: EcoPharmWarehouse
  messages:
    basename: "messages,config.i18n.messages"
    fallback-to-system-locale: false
    encoding: UTF-8
  jpa:
    database: postgresql
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: ${spring.liquibase.default-schema}
        jdbc:
          batch_size: 30
        order_updates: true
        order_insert: true
        generate_statistics: true
  datasource:
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
            logger-level: full
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/eco-pharma
          jwk-set-uri: http://localhost:8088/realms/eco-pharma/protocol/openid-connect/certs

logging:
  config: classpath:log4j2.xml

keycloak:
  realm: eco-pharma
  auth-server-url: http://localhost:8088
  client-id: eco-pharma-warehouse
