databaseChangeLog:
  # Include ShedLock changeset (optional)
  - changeSet:
      id: shedlock_01
      author: alex
      changes:
        - sqlFile:
            path: db/changelog/tables/2025_01_31_shedlock_01.sql

  # Schema creation from raw SQL
  - changeSet:
      id: create_schema_v1
      author: alex
      changes:
        - sqlFile:
            path: db/changelog/tables/create_tables.sql

  # Seed data insertion from another SQL file
  - changeSet:
      id: seed_initial_data_v1
      author: alex
      changes:
        - sqlFile:
            path: db/changelog/tables/insert_init_data.sql

  # Schema creation update
  - changeSet:
      id: create_schema_v2
      author: DAVRON
      changes:
        - sqlFile:
            path: db/changelog/tables/v2_0__create_tables.sql