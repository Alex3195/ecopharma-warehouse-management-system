server:
  port: 9091

spring:
  datasource:
    url: jdbc:postgresql://192.168.7.133:5432/wms
    username: postgres
    password: postgres
  jpa:
    show-sql: true
  liquibase:
    default-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.rivermed.uz/realms/pharm
          jwk-set-uri: https://keycloak.rivermed.uz/realms/pharm/protocol/openid-connect/certs
  rabbitmq:
    host: api-jms.rivermed.uz
    port: 5671
    username: admin
    password: admin!123
    ssl:
      enabled: true
      trust-store: classpath:truststore.p12
      trust-store-password: Dev@2552!
      trust-store-type: PKCS12

keycloak:
  realm: pharm
  auth-server-url: https://keycloak.rivermed.uz
  client-id: pharm
  client-secret: IODMDQALC7jHyZBlFg1yNJL5Vvt0tPcT
  public-key: 

eureka:
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: https://discovery.rivermed.uz/eureka/
    healthcheck:
      enabled: true
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 10

springdoc:
  api-docs:
    enabled: true
    path: /api/v1/wms/v3/api-docs
  swagger-ui:
    path: /api/v1/wms/swagger-ui
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method

minio:
  endpoint: https://storage.rivermed.uz
  access-key: 4eTbVd5A0wCbisN8bP0b
  secret-key: 7Wh2bLKVRR8alNvAEmZi7RHx7eggWGtsEuaZnBJ1
  bucket: backups

postgres:
  container:
    name: eco-pharma-warehouse-postgres

backup:
  useShell: false