server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PASSWORD}
  jpa:
    show-sql: false
  liquibase:
    default-schema: ${LIQUIBASE_DEFAULT_SCHEMA}

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    filter: true
    path: /swagger-ui
    try-it-out-enabled: true
    operations-sorter: method

api:
  url: ${API_URL}
  connection-timeout: ${CONNECTION_TIME_OUT}
  read-timeout: ${READ_TIME_OUT}
